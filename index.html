<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 시황 브리핑</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --text: #16181d;
    --sub: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
    --up: #d64545;
    --down: #2f6fed;
    --hero-bg-from: #14172b;
    --hero-bg-to: #262b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 0 64px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.65;
  }
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }
  .topbar-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .topbar-inner .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .hero-header {
    background: linear-gradient(135deg, var(--hero-bg-from), var(--hero-bg-to));
    color: #fff;
    padding: 20px 0 0;
  }
  .hero-header-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .hero {
    background: linear-gradient(135deg, var(--hero-bg-from), var(--hero-bg-to));
    color: #fff;
    padding: 20px 16px 28px;
  }
  .hero-inner {
    max-width: 720px;
    margin: 0 auto;
  }
  .hero-date {
    color: #d7dae6;
    font-size: 2.1rem;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .tabbar {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 11px 8px;
    border: none;
    border-radius: 10px 10px 0 0;
    background: rgba(255,255,255,0.06);
    color: #a7adc7;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--bg);
    color: var(--text);
  }
  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
  }
  .panel-content {
    max-width: 720px;
    margin: 24px auto 0;
    padding: 0 16px;
  }
  .placeholder-msg {
    text-align: center;
    color: var(--sub);
    padding: 48px 22px;
  }
  .hero-headline {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.5;
    margin: 0 0 16px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 10px;
    margin-top: 4px;
  }
  .stat {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat-label {
    font-size: 0.75rem;
    color: #a7adc7;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 0.95rem;
    font-weight: 700;
  }
  .stat-change {
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 2px;
  }
  main {
    max-width: 720px;
    margin: 24px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 0.75rem;
    flex-shrink: 0;
  }
  .card p {
    margin: 0;
    font-size: 0.95rem;
    color: #333;
  }
  .card p br {
    content: "";
    display: block;
    margin-top: 0.55em;
  }
  footer {
    max-width: 720px;
    margin: 32px auto 0;
    padding: 0 16px;
    color: var(--sub);
    font-size: 0.8rem;
    text-align: center;
  }
  .summary-btn-wrap {
    max-width: 720px;
    margin: 18px auto 0;
    padding: 0 16px;
  }
  .summary-btn {
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .summary-btn:hover {
    filter: brightness(1.08);
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 26, 0.55);
    z-index: 50;
    padding: 20px;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal-box {
    background: var(--card-bg);
    border-radius: 14px;
    max-width: 520px;
    width: 100%;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 {
    margin: 0;
    font-size: 1rem;
  }
  .modal-close {
    border: none;
    background: none;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    color: var(--sub);
    padding: 4px;
  }
  .modal-body {
    padding: 18px;
    overflow-y: auto;
  }
  .chat-text {
    white-space: pre-wrap;
    font-size: 0.92rem;
    color: #222;
    margin: 0;
  }
  .modal-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
  }
  .copy-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
  }
  .copy-btn.copied {
    background: var(--up);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner"><span class="dot"></span>주식 시장 브리핑</div>
  </div>

  <div class="hero-header">
    <div class="hero-header-inner">
      <div class="hero-date">2026년 09월 03일 (목)</div>
      <div class="tabbar">
        <button class="tab-btn active" id="tabbtn-morning" onclick="switchTab('morning')">개장 전 브리핑</button>
        <button class="tab-btn" id="tabbtn-lunch" onclick="switchTab('lunch')">점심시간</button>
        <button class="tab-btn" id="tabbtn-close" onclick="switchTab('close')">시장마감</button>
      </div>
    </div>
  </div>

  <div class="tab-panel active" id="panel-morning">
    <div class="panel-content">
      <div class="card placeholder-msg">브리핑 준비중입니다</div>
    </div>
  </div>

  <div class="tab-panel" id="panel-lunch">
    <div class="panel-content">
      <div class="card placeholder-msg">브리핑 준비중입니다</div>
    </div>
  </div>

  <div class="tab-panel" id="panel-close">
    <div class="panel-content">
      <div class="card placeholder-msg">브리핑 준비중입니다</div>
    </div>
  </div>

  <footer>
    이 페이지는 매일 자동으로 수집·생성됩니다. 투자 판단의 참고용이며, 투자 조언이 아닙니다.
  </footer>


  <script>
    function switchTab(name) {
      ['morning', 'lunch', 'close'].forEach(function(n) {
        document.getElementById('panel-' + n).classList.toggle('active', n === name);
        document.getElementById('tabbtn-' + n).classList.toggle('active', n === name);
      });
    }
    function copyText(elementId) {
      var text = document.getElementById(elementId).innerText;
      var btn = document.getElementById('copyBtn-' + elementId);
      function showCopied() {
        btn.textContent = '복사됐습니다!';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = '누르면 복사됩니다';
          btn.classList.remove('copied');
        }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopied();
      }
    }
    var modalEl = document.getElementById('summaryModal');
    if (modalEl) {
      modalEl.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
      });
    }
  </script>
</body>
</html>
